
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; text-align: center; margin-top: 50px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; border-top: 5px solid #27ae60; }
        .tag { font-size: 22px; font-weight: bold; color: #e67e22; background: #fef5e7; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #27ae60;">🎉 Animal Registration Successful!</h2>
        <p>Digital Livestock ID Generated:</p>
        <div class="tag">{{ tag_id }}</div>
        <p><strong>Owner Name:</strong> {{ owner_name }}</p>
        <p><strong>Registered Breed:</strong> {{ breed }}</p>
        <p>Status: <span style="color: #d35400;">Pending Verification</span></p>
        <br>
        <a href="/" style="color: #2980b9; text-decoration: none;">← Register Another Animal</a>
    </div>
</body>
</html>
